# Render "Blueprint" -- lets Render create both the web service and the
# free Postgres database from this one file (Dashboard: New -> Blueprint,
# point it at this repo). See README.md "Deployment" section for the
# click-by-click steps (account creation etc. has to happen on render.com
# itself, this file just describes what to create).
databases:
  - name: digitalgp-db
    plan: free
    databaseName: digitalgp_db
    user: digitalgp

services:
  - type: web
    name: digitalgp-python
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn digitalgp_core.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ""
      - key: BASE_DOMAIN
        value: "localhost"
      - key: DATABASE_URL
        fromDatabase:
          name: digitalgp-db
          property: connectionString
