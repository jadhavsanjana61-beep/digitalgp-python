<script>
    // Close other open dropdowns when one opens, and close on outside click.
    document.addEventListener('DOMContentLoaded', function () {
        var allDetails = document.querySelectorAll('.site-nav details');
        allDetails.forEach(function (d) {
            d.addEventListener('toggle', function () {
                if (d.open) {
                    allDetails.forEach(function (other) {
                        if (other !== d) other.open = false;
                    });
                }
            });
        });
        document.addEventListener('click', function (e) {
            if (!e.target.closest('.site-nav')) {
                allDetails.forEach(function (d) { d.open = false; });
            }
        });
        var toggle = document.getElementById('nav-toggle');
        document.querySelectorAll('.nav-list a').forEach(function (a) {
            a.addEventListener('click', function () { if (toggle) toggle.checked = false; });
        });
    });
</script>
