<style>
    /* Structural / layout CSS shared by all three themes.
       Each theme's own <style> block (loaded after this one) only sets
       color variables + a few themed accents -- see template1/2/3/base.html. */

    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; }
    img { max-width: 100%; display: block; }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

    header .container { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .header-titles h1 { margin: 0 0 2px; font-size: 1.7rem; }
    .header-titles p { margin: 0; opacity: 0.85; font-size: 0.95rem; }
    .header-actions a { font-size: 0.85rem; text-decoration: none; padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.5); }

    /* ---- Nav / dropdown mega-menu ---- */
    .site-nav { position: relative; }
    .nav-list { list-style: none; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; margin: 0; padding: 6px 12px; gap: 2px; }
    .nav-list > li { position: relative; }
    .nav-list > li > a, .nav-list summary { display: block; padding: 12px 16px; text-decoration: none; font-size: 0.92rem; cursor: pointer; list-style: none; user-select: none; }
    .nav-list summary::-webkit-details-marker { display: none; }
    .nav-list summary::after { content: " ▾"; font-size: 0.75em; opacity: 0.8; }
    .has-dropdown details[open] summary::after { content: " ▴"; }

    .dropdown { list-style: none; margin: 0; padding: 6px; position: absolute; top: 100%; left: 0; min-width: 220px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); z-index: 40; }
    .dropdown li a { display: block; padding: 9px 12px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; white-space: nowrap; }

    .nav-cta { border-radius: 20px !important; font-weight: 600; }

    .nav-toggle, .nav-toggle-label { display: none; }

    @media (max-width: 880px) {
        .nav-toggle-label { display: flex; flex-direction: column; justify-content: center; gap: 5px; width: 40px; height: 40px; margin: 10px auto; cursor: pointer; }
        .nav-toggle-label span { display: block; height: 3px; border-radius: 2px; background: currentColor; }
        .site-nav { display: none; }
        .nav-toggle:checked ~ .site-nav { display: block; }
        .nav-list { flex-direction: column; align-items: stretch; padding: 0 12px 12px; }
        .dropdown { position: static; box-shadow: none; margin-top: 4px; }
        header .container { flex-direction: column; text-align: center; }
    }

    /* ---- Homepage hero + stat pills ---- */
    .hero { position: relative; border-radius: 16px; overflow: hidden; margin: 20px 0; min-height: 260px; display: flex; align-items: flex-end; }
    .hero img, .hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .hero-overlay { position: relative; z-index: 2; padding: 26px; background: linear-gradient(0deg, rgba(0,0,0,0.7), rgba(0,0,0,0)); width: 100%; color: #fff; }
    .hero-overlay h2 { margin: 0 0 6px; font-size: 1.5rem; }
    .hero-overlay p { margin: 0; opacity: 0.9; }
    .hero-fallback { min-height: 200px; display: flex; align-items: center; justify-content: center; border-radius: 16px; margin: 20px 0; color: white; text-align: center; padding: 30px; }
    .hero-fallback h2 { margin: 0 0 6px; }

    .quick-stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 4px 0 22px; }
    .quick-stats .pill { padding: 9px 18px; border-radius: 24px; font-size: 0.85rem; }

    .two-col { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; align-items: start; }
    @media (max-width: 760px) { .two-col { grid-template-columns: 1fr; } }

    .narrow-card { max-width: 460px; margin: 20px auto; }

    /* ---- Content layout ---- */
    main { min-height: 55vh; }
    .page-header { padding: 22px 0 6px; }
    .page-header h2 { margin: 0; font-size: 1.5rem; }

    .card { border-radius: 12px; padding: 22px; margin-bottom: 20px; transition: box-shadow 0.15s ease, transform 0.15s ease; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    .grid .card { padding: 0 0 16px; overflow: hidden; }
    .grid .card:hover { transform: translateY(-3px); }
    .grid .card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; margin-bottom: 12px; }
    .grid .card h4, .grid .card p { margin: 0 6px 6px; padding: 0 10px; }
    .grid .card h4 { margin-top: 4px; }
    .grid .card .btn { margin-left: 16px; }

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px; }
    .stat-card { text-align: center; padding: 26px 16px; }
    .stat-card .stat-value { font-size: 2.3rem; font-weight: 700; margin: 0; line-height: 1; }

    .muted { opacity: 0.7; font-size: 0.9rem; }
    .btn { display: inline-block; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; margin-top: 8px; font-weight: 600; transition: opacity 0.15s ease; }
    .btn:hover { opacity: 0.85; }

    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.92rem; }
    input[type=text], input[type=tel], input[type=password], input[type=email], textarea, select { width: 100%; padding: 9px 11px; border-radius: 8px; font-size: 1rem; margin-bottom: 2px; }

    .site-footer { margin-top: 50px; padding: 36px 0 0; }
    .footer-grid { max-width: 1100px; margin: 0 auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; }
    .site-footer h4 { margin: 0 0 8px; font-size: 0.95rem; }
    .site-footer p { margin: 0 0 6px; font-size: 0.88rem; }
    .site-footer a { text-decoration: none; }
    .site-footer a:hover { text-decoration: underline; }
    .footer-social a { margin-right: 10px; }
    .footer-bottom { text-align: center; padding: 18px 20px; margin-top: 24px; font-size: 0.8rem; opacity: 0.75; }
</style>
