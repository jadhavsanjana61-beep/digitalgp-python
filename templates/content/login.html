{% extends base_template %}
{% block content %}
<div class="container py-5">
    <div class="page-header text-center" style="border-bottom:none;"><h2>प्रशासक लॉगिन</h2></div>
    <div class="card card-custom narrow-card p-4">
        {% if error %}<p class="text-danger fw-bold">{{ error }}</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p class="text-danger small">{{ field.errors|striptags }}</p>{% endif %}
            </div>
            {% endfor %}
            <button class="btn btn-primary-custom w-100 rounded-pill" type="submit">लॉगिन करा</button>
        </form>
    </div>
</div>
{% endblock %}
