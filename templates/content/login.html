{% extends base_template %}
{% block content %}
<div class="page-header" style="text-align:center;border-bottom:none;"><h2>प्रशासक लॉगिन</h2></div>
<div class="card narrow-card">
    {% if error %}<p style="color:#c0392b;font-weight:bold;">{{ error }}</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div style="margin-bottom:14px;">
            <label>{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<p style="color:#c0392b;font-size:0.85rem;">{{ field.errors|striptags }}</p>{% endif %}
        </div>
        {% endfor %}
        <button class="btn" type="submit" style="width:100%;">लॉगिन करा</button>
    </form>
</div>
{% endblock %}
